name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_app:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Download Go modules
      run: go mod download

    - name: Run tests
      run: make test
