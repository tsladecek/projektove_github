name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release-executable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build for Linux (amd64)
        run: make bin/projektove_github-linux-amd64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/projektove_github-linux-amd64
